name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `--include=dev`: the toolchain (tsc, eslint, vitest) is a dev dependency, and a bare
      # `npm ci` under NODE_ENV=production would install production dependencies only, so every
      # step below would fail with "not found".
      - run: npm ci --include=dev

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test